# Prevents SonarQube Cloud from deleting projects (free plan) of rarely changed repositories
# by triggering the regular build on their default branch if there was no analysis recently.
# See README.md for details and the required GitHub App setup.

name: SonarQube Cloud Keepalive

on:
  schedule:
    - cron: '17 4 1 * *'  # 1st day of every month 04:17 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only report, do not trigger any builds
        type: boolean
        default: true
      max-age-days:
        description: Trigger a build if there was no analysis/build within this number of days
        type: number
        default: 30
      repository:
        description: >-
          Optional: only trigger the build of this repository (<org>/<repo>),
          regardless of last analysis and recent builds
        type: string
        default: ''

concurrency: ${{ github.workflow }}

permissions:
  contents: read

env:
  # Trigger a build if there was no analysis/build within this number of days
  MAX_AGE_DAYS: 30
  # Build workflow to dispatch in each repository
  WORKFLOW_FILE: maven-build.yml

jobs:
  keepalive:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # GitHub organizations to check (GitHub organization name = SonarQube Cloud organization key)
        org:
          - wcm-io
          - wcm-io-devops
          - wcm-io-caravan
          - wcm-io-frontend
          - wcm-io-qa

    steps:
      - name: Checkout code
        if: ${{ !inputs.repository || startsWith(inputs.repository, format('{0}/', matrix.org)) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create GitHub App token
        if: ${{ !inputs.repository || startsWith(inputs.repository, format('{0}/', matrix.org)) }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.SONARCLOUD_KEEPALIVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SONARCLOUD_KEEPALIVE_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}
          permission-actions: write
          permission-metadata: read

      - name: Trigger builds for stale SonarQube Cloud projects
        if: ${{ !inputs.repository || startsWith(inputs.repository, format('{0}/', matrix.org)) }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_MAX_AGE_DAYS: ${{ inputs.max-age-days || env.MAX_AGE_DAYS }}
          INPUT_DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
          INPUT_REPOSITORY: ${{ inputs.repository }}
        run: >-
          python3 scripts/sonarcloud_keepalive.py
          --org "${{ matrix.org }}"
          --max-age-days "$INPUT_MAX_AGE_DAYS"
          --workflow-file "$WORKFLOW_FILE"
          $INPUT_DRY_RUN
          ${INPUT_REPOSITORY:+--repo "$INPUT_REPOSITORY"}
